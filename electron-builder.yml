appId: com.millhouse.lsblauncher
productName: LSB Launcher
copyright: Copyright (C) 2026 Mill House
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/xiloader
    to: xiloader
    filter:
      - "**/*"
  - from: resources/ashita
    to: ashita
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-Setup.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LSB Launcher
