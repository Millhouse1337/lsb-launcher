appId: com.millhouse.lsblauncher
productName: LSMTestServer
copyright: Copyright (C) 2026 Mill House
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/xiloader
    to: xiloader
    filter:
      - "**/*"
  - from: resources/ashita
    to: ashita
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup.${ext}"
nsis:
  oneClick: false
  perMachine: false
  # The launcher writes its Ashita profile inside its own install dir, so it must land
  # somewhere writable. Letting a tester choose C:\Program Files makes Play fail
  # with an EPERM on first launch.
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LSManagerTestServer
